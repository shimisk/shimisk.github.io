function useGameData() {
  const allItems = [
    ...(_WEAPONS_DATA.items   || []),
    ...(_FOOD_DATA.items      || []),
    ...(_MATERIALS_DATA.items || []),
  ];
  const data = {
    bosses:   _BOSSES_DATA,
    weapons:  _WEAPONS_DATA,
    armor:    _ARMOR_DATA,
    food:     _FOOD_DATA,
    materials:_MATERIALS_DATA,
    vendors:  _VENDORS_DATA,
    allItems,
  };
  return { data, loading: false, error: null };
}

const STYLE_COLORS = { warrior:"#c4944a", rogue:"#4a9a8a", berserker:"#c44a4a", mage:"#7a6b8a", ranger:"#4a9a6a" };
const STYLE_ICONS  = { warrior:"⚔️", rogue:"🗡", berserker:"💢", mage:"🔮", ranger:"🏹" };

const BOSS_BIOME_SEQUENCE = ["Meadows","Black Forest","Swamp","Mountain","Plains","Mistlands","Ashlands"];

function getCurrentBiome(bosses) {
  const defeated = bosses.filter(b => b.defeated).sort((a,b) => b.id - a.id);
  if (defeated.length === 0) return "Meadows";
  const idx = BOSS_BIOME_SEQUENCE.indexOf(defeated[0].biome);
  return BOSS_BIOME_SEQUENCE[Math.min(idx + 1, BOSS_BIOME_SEQUENCE.length - 1)];
}

// ─── Armor sets grid ───
function ArmorPanel({ bosses, armorSets, allItems }) {
  const [activeSet, setActiveSet] = useState(null);

  const currentBiome = useMemo(() => getCurrentBiome(bosses), [bosses]);
  const currentTier  = useMemo(() => BIOME_TIER[currentBiome] || 1, [currentBiome]);

  if (activeSet) {
    const set = armorSets.find(s => s.id === activeSet);
    return <ArmorSetDetail set={set} onBack={() => setActiveSet(null)} />;
  }

  return (
    <div>
      {/* Current zone banner */}
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:22, padding:"12px 16px", background:"#141814", borderRadius:8, border:"1px solid #1e2320" }}>
        <span style={{ fontSize:22 }}>{BIOME_ICONS[currentBiome]}</span>
        <div>
          <div style={{ fontSize:11, color:"#4a4a3a", letterSpacing:2, textTransform:"uppercase", fontFamily:"'Crimson Text',serif" }}>Current zone</div>
          <div style={{ fontSize:16, fontWeight:600, color:BIOME_COLORS[currentBiome], letterSpacing:1, minWidth:"120px" }}>{currentBiome}</div>
        </div>
        <div style={{ marginLeft:"auto", fontFamily:"'Crimson Text',serif", fontSize:12, color:"#4a4a3a", fontStyle:"italic" }}>
          Sets dimmed if not yet reachable · update in <span style={{ color:"#d4aa60" }}>Bosses</span> tab
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))", gap:14 }}>
        {armorSets.map(set => {
          const unlocked = set.tier <= currentTier;
          const isBest = set.tier === Math.max(...armorSets.filter(s => s.tier <= currentTier && s.style === set.style).map(s => s.tier));

          return (
            <div key={set.id} onClick={() => setActiveSet(set.id)}
              style={{ background: unlocked ? "linear-gradient(135deg,#1a1f1a 0%,#141814 100%)" : "#111412", border:"1px solid", borderColor: isBest && unlocked ? set.color : unlocked ? "#2a2f2a" : "#1a1a1a", borderRadius:10, padding:"20px 18px", cursor:"pointer", transition:"all 0.25s", opacity: unlocked ? 1 : 0.4, position:"relative" }}
              onMouseEnter={e => { if(unlocked){e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow=`0 10px 30px rgba(0,0,0,0.5)`;} }}
              onMouseLeave={e => { e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"; }}>

              {/* Best badge */}
              {isBest && unlocked && (
                <div style={{ position:"absolute", top:12, right:12, fontSize:10, color:"#d4aa60", background:"#1e1a0e", border:"1px solid #d4aa60", padding:"2px 8px", borderRadius:10, letterSpacing:1 }}>✦ BEST</div>
              )}
              {!unlocked && (
                <div style={{ position:"absolute", top:12, right:12, fontSize:10, color:"#3a3a3a", background:"#111", border:"1px solid #1e1e1e", padding:"2px 8px", borderRadius:10 }}>🔒 LOCKED</div>
              )}

              {/* Set icon + name */}
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                <span style={{ fontSize:38 }}>{set.icon}</span>
                <div>
                  <div style={{ fontSize:14, fontWeight:700, color: unlocked ? set.color : "#3a3a3a", letterSpacing:1 }}>{set.name}</div>
                  <div style={{ fontSize:11, color: unlocked ? BIOME_COLORS[set.biome] : "#2a2a2a", marginTop:2 }}>{BIOME_ICONS[set.biome]} {set.biome}</div>
                </div>
              </div>

              {/* Playstyle */}

function getWeaponsForCategory(cat, allItems) {
  return allItems.filter(i => ["OneHandedWeapon","TwoHandedWeapon","Bow","Ammo","Throwable","MagicWeapon","Shield"].includes(i.type) && cat.match(i));
}
function getBestWeaponForCategory(cat, currentBiomeTier, allItems) {
  const available = getWeaponsForCategory(cat, allItems).filter(w => w.biome && w.biome !== "Unknown" && (BIOME_TIER[w.biome]||0) <= currentBiomeTier);
  if (!available.length) return null;
  return available.sort((a,b) => (BIOME_TIER[b.biome]||0) - (BIOME_TIER[a.biome]||0))[0];
}

  return (

function FoodList({ cat, bosses, allItems, onBack }) {
  const [activeBiome, setActiveBiome] = useState("All");
  const [search, setSearch] = useState("");
  const [selectedItem, setSelectedItem] = useState(null);
  const BIOMES = ["Meadows","Black Forest","Swamp","Mountain","Plains","Ocean","Mistlands","Ashlands"];

  const currentBiome = useMemo(() => getCurrentBiome(bosses), [bosses]);
  const currentTier = BIOME_TIER[currentBiome] || 1;

  const foods = useMemo(() => {
    return allItems.filter(item => {
      if (!["Consumable","Fish"].includes(item.type)) return false;
      if ((item.foodCategory||"potion") !== cat.id) return false;
      const q = search.toLowerCase();
      if (q && !item.name.toLowerCase().includes(q)) return false;
      if (activeBiome !== "All" && item.biome !== activeBiome) return false;
      return true;
    }).sort(cat.sortKey);
  }, [cat, activeBiome, search]);

  return (
    <div>
      {/* Back + header */}
      <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:22, flexWrap:"wrap" }}>

          ← Back
        </button>
        <div>
          <h2 style={{ fontSize:20, fontWeight:700, color:cat.color, letterSpacing:2 }}>{cat.emoji} {cat.label}</h2>
          <p style={{ fontFamily:"'Crimson Text',serif", color:"#6a6a5a", fontSize:13, fontStyle:"italic" }}>{cat.desc}</p>
        </div>
        <div style={{ marginLeft:"auto", fontFamily:"'Crimson Text',serif", fontSize:12, color:"#4a4a3a", fontStyle:"italic" }}>
          {BIOME_ICONS[currentBiome]} <span style={{ color:BIOME_COLORS[currentBiome] }}>{currentBiome}</span>
        </div>
      </div>

      {/* Search + biome filters */}
      <input className="search-input" placeholder={`Search ${cat.label.toLowerCase()} food...`} value={search}
        style={{ marginBottom:10 }} onChange={e => { setSearch(e.target.value); setSelectedItem(null); }} />
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
        <button className="biome-btn" onClick={() => { setActiveBiome("All"); setSelectedItem(null); }}

        {BIOMES.map(b => (

      {/* Food list */}
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {foods.map((item, i) => {
          const isAvailable = !item.biome || item.biome==="Unknown" || (BIOME_TIER[item.biome]||0) <= currentTier;
          return (
            <div key={i} onClick={() => setSelectedItem(selectedItem===i?null:i)}

                      <span style={{ fontSize:11, color:"#c04a4a", width:14 }}>❤️</span>
                      <div style={{ flex:1, background:"#1a1010", borderRadius:3, height:6, overflow:"hidden" }}>

              </div>

              {/* Expanded */}
              {selectedItem===i && (
                <div style={{ marginTop:12, borderTop:"1px solid #2a2a1a", paddingTop:12 }}>
                  <p style={{ fontFamily:"'Crimson Text',serif", fontSize:13, color:"#8a7a60", fontStyle:"italic", lineHeight:1.5, marginBottom:10 }}>{item.desc}</p>
                  {item.recipe && (
                    <div style={{ background:"#0e120e", border:"1px solid #2a3a1a", borderRadius:6, padding:"8px 12px" }}>
                      <div style={{ fontSize:10, color:"#4a6a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>🔨 Recipe</div>

        {foods.length===0 && (
          <div style={{ textAlign:"center", padding:40, fontFamily:"'Crimson Text',serif", color:"#3a3a2a", fontStyle:"italic" }}>The ravens found nothing...</div>
        )}
      </div>
    </div>
  );
}

function FoodPanel({ bosses, foodCategories, allItems }) {
  const [activeView, setActiveView] = useState(null); // "health"|"stamina"|"neutral"|"potion"|"combo_health"|"combo_stamina"|"combo_avg"
  const BIOMES = ["Meadows","Black Forest","Swamp","Mountain","Plains","Ocean","Mistlands","Ashlands"];

  const currentBiome = useMemo(() => getCurrentBiome(bosses), [bosses]);
  const currentTier = BIOME_TIER[currentBiome] || 1;

  // All available foods for combos
  const availableFoods = useMemo(() =>
    allItems.filter(i =>
      ["Consumable","Fish"].includes(i.type) &&
      ["health","stamina","neutral"].includes(i.foodCategory) &&
      (i.health||0) + (i.stamina||0) > 0 &&
      (BIOME_TIER[i.biome]||0) <= currentTier
    ), [currentTier]);

  // Compute best combos dynamically from available foods
  const combos = useMemo(() => {
    if (availableFoods.length < 3) return null;
    let bestH = null, bestS = null, bestAvg = null;
    let maxH = 0, maxS = 0, maxAvg = 0;
    const foods = availableFoods;
    for (let a = 0; a < foods.length; a++) {
      for (let b = a+1; b < foods.length; b++) {
        for (let c = b+1; c < foods.length; c++) {
          const trio = [foods[a], foods[b], foods[c]];
          const h = trio.reduce((s,f)=>s+(f.health||0),0);
          const st = trio.reduce((s,f)=>s+(f.stamina||0),0);
          if (h > maxH) { maxH = h; bestH = trio; }
          if (st > maxS) { maxS = st; bestS = trio; }
          if (h+st > maxAvg) { maxAvg = h+st; bestAvg = trio; }
        }
      }
    }
    return {
      health:  { foods: bestH,  totalH: maxH,           totalS: bestH.reduce((s,f)=>s+(f.stamina||0),0) },
      stamina: { foods: bestS,  totalH: bestS.reduce((s,f)=>s+(f.health||0),0), totalS: maxS },
      avg:     { foods: bestAvg, totalH: bestAvg.reduce((s,f)=>s+(f.health||0),0), totalS: bestAvg.reduce((s,f)=>s+(f.stamina||0),0) },
    };
  }, [availableFoods]);

  // Combo panel config
  const comboCfg = {
    combo_health:  { emoji:"❤️🏆", label:"Best Health Combo",    desc:"Max health from 3 foods",           color:"#c04a4a", key:"health"  },
    combo_stamina: { emoji:"⚡🏆", label:"Best Stamina Combo",   desc:"Max stamina from 3 foods",          color:"#4a8acc", key:"stamina" },
    combo_avg:     { emoji:"⚖️🏆", label:"Best Balanced Combo",  desc:"Highest total health + stamina",    color:"#8aaa4a", key:"avg"     },
  };

  // Drill into combo view
  if (activeView && activeView.startsWith("combo_") && combos) {
    const cfg = comboCfg[activeView];
    const data = combos[cfg.key];
    return <BestComboPanel combo={{ ...cfg, ...data }} onBack={() => setActiveView(null)} />;
  }

  // Drill into food category list
  if (activeView && !activeView.startsWith("combo_")) {
    const cat = FOOD_CATEGORIES.find(c => c.id === activeView);
    return <FoodList cat={cat} bosses={bosses} allItems={allItems} onBack={() => setActiveView(null)} />;
  }

  // Main grid
  return (
    <div>
      {/* Zone banner */}
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:22, padding:"12px 16px", background:"#141814", borderRadius:8, border:"1px solid #1e2320" }}>
        <span style={{ fontSize:22 }}>{BIOME_ICONS[currentBiome]}</span>
        <div>
          <div style={{ fontSize:11, color:"#4a4a3a", letterSpacing:2, textTransform:"uppercase", fontFamily:"'Crimson Text',serif" }}>Current zone</div>
          <div style={{ fontSize:16, fontWeight:600, color:BIOME_COLORS[currentBiome], letterSpacing:1, minWidth:"120px" }}>{currentBiome}</div>
        </div>
        <div style={{ marginLeft:"auto", fontFamily:"'Crimson Text',serif", fontSize:12, color:"#4a4a3a", fontStyle:"italic" }}>
          Synced from <span style={{ color:"#d4aa60" }}>Bosses</span> tab
        </div>
      </div>

      {/* Best combo cards */}
      <div style={{ fontSize:11, color:"#4a4a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:12 }}>✦ Best meal combos for your zone</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:12, marginBottom:28 }}>
        {combos ? [
          { id:"combo_health",  emoji:"❤️", label:"Max Health",   color:"#c04a4a", key:"health",  stat:"totalH", statLabel:"Total HP",      statColor:"#e06a6a" },
          { id:"combo_stamina", emoji:"⚡", label:"Max Stamina",  color:"#4a8acc", key:"stamina", stat:"totalS", statLabel:"Total Stamina",  statColor:"#6aaaee" },
          { id:"combo_avg",     emoji:"⚖️", label:"Best Balance", color:"#8aaa4a", key:"avg",     stat:null,     statLabel:"Balanced",       statColor:"#aace6a" },
        ].map(cfg => {
          const combo = combos[cfg.key];
          const displayStat = cfg.stat ? combo[cfg.stat] : combo.totalH + combo.totalS;
          return (

              style={{ background:"linear-gradient(135deg,#1a1f1a 0%,#141814 100%)", border:`1px solid ${cfg.color}44`, borderRadius:10, padding:"18px 16px", cursor:"pointer", transition:"all 0.25s" }}

                      <span style={{ fontSize:12, color:"#c04a4a" }}>❤️</span>
                      <span style={{ fontSize:18, fontWeight:800, color:"#e06a6a", fontFamily:"'Crimson Text',serif", lineHeight:1 }}>{combo.totalH}</span>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                      <span style={{ fontSize:12, color:"#4a8acc" }}>⚡</span>
                      <span style={{ fontSize:18, fontWeight:800, color:"#6aaaee", fontFamily:"'Crimson Text',serif", lineHeight:1 }}>{combo.totalS}</span>
                    </div>
                  </div>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {combo.foods.map((f,i) => (
                  <div key={i} style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#6a7a5a", display:"flex", gap:6, alignItems:"center" }}>
                    <span style={{ color:cfg.color, fontSize:10 }}>{"●"}</span>{f.name}
                  </div>
                ))}
              </div>
            </div>
          );
        }) : (
          <div style={{ gridColumn:"1/-1", fontFamily:"'Crimson Text',serif", fontSize:13, color:"#3a4a3a", fontStyle:"italic", padding:"12px 0" }}>
            Not enough foods available yet to calculate combos
          </div>
        )}
      </div>

      {/* Food category cards */}
      <div style={{ fontSize:11, color:"#4a4a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:12 }}>Browse by category</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:14 }}>
        {FOOD_CATEGORIES.map(cat => {
          const catItems = allItems.filter(i => ["Consumable","Fish"].includes(i.type) && (i.foodCategory||"potion")===cat.id);
          const available = catItems.filter(i => !i.biome || i.biome==="Unknown" || (BIOME_TIER[i.biome]||0)<=currentTier);

          return (

              onMouseLeave={e => { e.currentTarget.style.borderColor="#2a2f2a"; e.currentTarget.style.transform="translateY(0)"; e.currentTarget.style.boxShadow="none"; }}>

function MaterialList({ biome, allItems, onBack }) {
  const [search, setSearch] = useState("");
  const [selectedItem, setSelectedItem] = useState(null);
  const MAT_TYPES = ["Material","Misc","Utility","Trophy"];

  const items = useMemo(() => allItems.filter(i => {
    if (!MAT_TYPES.includes(i.type)) return false;
    if (i.biome !== biome) return false;
    const q = search.toLowerCase();
    if (q && !i.name.toLowerCase().includes(q) && !(i.desc||"").toLowerCase().includes(q)) return false;
    return true;
  }), [biome, search, allItems]);

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:22 }}>
        <button onClick={onBack} style={{ background:"#1a1f1a", border:"1px solid #3a3a2a", color:"#d4aa60", fontFamily:"'Cinzel',serif", fontSize:12, padding:"8px 16px", borderRadius:6, cursor:"pointer", letterSpacing:1 }}>← Back</button>
        <div>
          <h2 style={{ fontSize:20, fontWeight:700, color:BIOME_COLORS[biome], letterSpacing:2 }}>{BIOME_ICONS[biome]} {biome}</h2>
          <p style={{ fontFamily:"'Crimson Text',serif", color:"#6a6a5a", fontSize:13, fontStyle:"italic" }}>Materials found in this biome</p>
        </div>
      </div>

      <input className="search-input" placeholder={`Search ${biome} materials...`} value={search}
        style={{ marginBottom:14 }} onChange={e => { setSearch(e.target.value); setSelectedItem(null); }} />

      <div style={{ fontSize:12, color:"#3a4a3a", fontFamily:"'Crimson Text',serif", marginBottom:14 }}>
        {items.length} item{items.length !== 1 ? "s" : ""}
      </div>

      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {items.map((item, i) => (
          <div key={i} onClick={() => setSelectedItem(selectedItem === i ? null : i)}
            style={{ background:selectedItem===i?"#1c1a10":"#141814", border:"1px solid", borderColor:selectedItem===i?BIOME_COLORS[biome]:"#1e2320", borderRadius:8, padding:"12px 16px", cursor:"pointer", transition:"all 0.2s" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#e8dfc8" }}>{item.name}</div>
                <div style={{ fontSize:11, color:"#4a4a3a", marginTop:2, fontFamily:"'Crimson Text',serif" }}>{item.type}</div>
              </div>
              {item.recipe && (
                <div style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#5a7a4a", maxWidth:220, textAlign:"right", lineHeight:1.3 }}>
                  {item.recipe.split("→")[0].trim()}
                </div>
              )}
              <span style={{ fontSize:14, color:selectedItem===i?BIOME_COLORS[biome]:"#3a3a2a", marginLeft:4 }}>{selectedItem===i?"▲":"▼"}</span>
            </div>

            {selectedItem === i && (
              <div style={{ marginTop:12, borderTop:"1px solid #2a2a1a", paddingTop:12 }}>
                <p style={{ fontFamily:"'Crimson Text',serif", fontSize:13, color:"#8a7a60", fontStyle:"italic", lineHeight:1.5, marginBottom:10 }}>{item.desc}</p>
                {item.recipe ? (
                  <div style={{ background:"#0e120e", border:"1px solid #2a3a1a", borderRadius:6, padding:"8px 12px" }}>
                    <div style={{ fontSize:10, color:"#4a6a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>🔨 How to get</div>
                    <div style={{ fontFamily:"'Crimson Text',serif", fontSize:14, color:"#8aaa6a", lineHeight:1.6 }}>{item.recipe}</div>
                  </div>
                ) : (
                  <div style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#3a4a3a", fontStyle:"italic" }}>No source data yet</div>
                )}
              </div>
            )}
          </div>
        ))}
        {items.length === 0 && (
          <div style={{ textAlign:"center", padding:40, fontFamily:"'Crimson Text',serif", color:"#3a3a2a", fontStyle:"italic" }}>The ravens found nothing...</div>
        )}
      </div>
    </div>
  );
}

              onMouseEnter={e => { e.currentTarget.style.borderColor=BIOME_COLORS[biome]; e.currentTarget.style.transform="translateY(-3px)"; e.currentTarget.style.boxShadow="0 10px 30px rgba(0,0,0,0.5)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor=BIOME_COLORS[biome]+"44"; e.currentTarget.style.transform="translateY(0)"; e.currentTarget.style.boxShadow="none"; }}>

              {/* Header */}

                <span style={{ fontSize:36 }}>{BIOME_ICONS[biome]}</span>

                  <div style={{ fontSize:11, color:"#4a4a3a", fontFamily:"'Crimson Text',serif" }}>{biomeItems.length} items</div>
                </div>
              </div>

              {/* Type breakdown */}
              <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:12 }}>
                {Object.entries(byType).map(([type, count]) => (
                  <span key={type} style={{ fontSize:10, color:"#5a6a5a", background:"#0e120e", border:"1px solid #1e2a1e", padding:"2px 8px", borderRadius:8 }}>
                    {count} {type}
                  </span>
                ))}
              </div>

              {/* Preview items */}
              {preview.length > 0 && (
                <div style={{ borderTop:"1px solid #1e2a1e", paddingTop:10, display:"flex", flexDirection:"column", gap:4 }}>
                  {preview.map((item, i) => (
                    <div key={i} style={{ fontSize:12, color:"#6a7a6a", fontFamily:"'Crimson Text',serif", display:"flex", gap:6, alignItems:"center" }}>
                      <span style={{ color:BIOME_COLORS[biome], fontSize:10 }}>▸</span>
                      <span style={{ color:"#9a9a8a" }}>{item.name}</span>
                      <span style={{ color:"#3a4a3a", fontSize:11 }}>— {(item.recipe||"").split("→")[0].trim().split(" ").slice(0,4).join(" ")}...</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Vendor item list (drill-in) ─────────────────────────────────────────────
function VendorDetail({ vendor, bosses, onBack }) {
  const [selectedItem, setSelectedItem] = useState(null);
  // Hildir chest state — tracked locally (player knows which they've returned)
  const [returnedChests, setReturnedChests] = useState({
    return_brass_chest: false,
    return_silver_chest: false,
    return_bronze_chest: false,
  });

  const toggleChest = (id) => setReturnedChests(prev => ({ ...prev, [id]: !prev[id] }));

  const BOSS_MAP = { defeat_elder:2, defeat_bonemass:3, defeat_moder:4, defeat_yagluth:5, defeat_queen:6, defeat_fader:7 };

  const isUnlocked = (req) => {
    if (!req) return true;
    if (req.startsWith("return_")) return returnedChests[req] ? true : false;
    const bossId = BOSS_MAP[req];
    if (!bossId) return true;
    return bosses.find(b => b.id === bossId)?.defeated || false;
  };

  const isHildir = vendor.id === "hildir";

  return (
    <div>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:22 }}>
        <button onClick={onBack} style={{ background:"#1a1f1a", border:"1px solid #3a3a2a", color:"#d4aa60", fontFamily:"'Cinzel',serif", fontSize:12, padding:"8px 16px", borderRadius:6, cursor:"pointer", letterSpacing:1 }}>← Back</button>
        <div>
          <h2 style={{ fontSize:20, fontWeight:700, color:vendor.color, letterSpacing:2 }}>{vendor.icon} {vendor.name}</h2>
          <p style={{ fontFamily:"'Crimson Text',serif", color:"#6a6a5a", fontSize:13, fontStyle:"italic" }}>{vendor.title}</p>
        </div>
      </div>

      {/* Location info */}
      <div style={{ background:"#141814", border:"1px solid #1e2320", borderRadius:8, padding:"14px 18px", marginBottom:20 }}>
        <div style={{ fontSize:10, color:"#4a4a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>📍 Location</div>
        <div style={{ fontFamily:"'Crimson Text',serif", fontSize:13, color:"#8a9a7a", lineHeight:1.5, marginBottom:10 }}>{vendor.location}</div>
        <div style={{ borderTop:"1px solid #1e2320", paddingTop:10, fontFamily:"'Crimson Text',serif", fontSize:13, color:"#7a7060", fontStyle:"italic" }}>
          💡 {vendor.tip}
        </div>
      </div>

      {/* ── Hildir chest quest tracker ── */}
      {isHildir && (
        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:10, color:"#9a4a6a", letterSpacing:2, textTransform:"uppercase", marginBottom:12 }}>📜 Returned chests — click to mark</div>
          <div style={{ display:"flex", gap:10 }}>
            {HILDIR_CHESTS.map(chest => {
              const done = returnedChests[chest.id];
              const itemsUnlocked = vendor.sells.filter(s => s.unlockRequirement === chest.id);
              return (
                <div key={chest.id} onClick={() => toggleChest(chest.id)}
                  style={{ flex:1, background: done ? "#0e160e" : "#141814", border:"2px solid", borderColor: done ? chest.color : "#2a2a2a", borderRadius:10, padding:"14px 12px", cursor:"pointer", transition:"all 0.2s", textAlign:"center" }}>
                  <div style={{ fontSize:36, marginBottom:6 }}>🧳</div>
                  <div style={{ fontSize:13, fontWeight:700, color: done ? chest.color : "#7a6a5a", letterSpacing:1, marginBottom:4 }}>{chest.name}</div>
                  <div style={{ fontSize:11, color: done ? "#8acc6a" : "#4a4a3a", fontFamily:"'Crimson Text',serif", marginBottom:8 }}>
                    {itemsUnlocked.length} item{itemsUnlocked.length !== 1 ? "s" : ""}
                  </div>
                  <div style={{ width:28, height:28, borderRadius:"50%", border:`2px solid ${done ? chest.color : "#3a3a3a"}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, color: done ? chest.color : "#3a3a3a", margin:"0 auto" }}>
                    {done ? "✓" : "○"}
                  </div>
                </div>
              );
            })}
          </div>
          <p style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#4a4a3a", fontStyle:"italic", marginTop:10 }}>
            ⚠ Chests cannot be teleported — carry them back by boat
          </p>
        </div>
      )}

      {/* What they buy */}
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:10, color:"#6a5a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:10 }}>💰 They buy (sell these for coins)</div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {vendor.buys.map((b, i) => (
            <div key={i} style={{ background:"#1a1810", border:"1px solid #2a2818", borderRadius:6, padding:"6px 14px", fontFamily:"'Crimson Text',serif", fontSize:13 }}>
              <span style={{ color:"#c4aa60" }}>{b.name}</span>
              <span style={{ color:"#6a5a3a", marginLeft:8 }}>→ {b.price} 🪙</span>
            </div>
          ))}
        </div>
      </div>

      {/* Items for sale */}
      <div style={{ fontSize:10, color:"#4a6a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:12 }}>🛒 For sale</div>
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {vendor.sells.map((item, i) => {
          const unlocked = isUnlocked(item.unlockRequirement);
          const locked = !unlocked;
          const isChestGated = item.unlockRequirement?.startsWith("return_");
          const chestInfo = isChestGated ? HILDIR_CHESTS.find(c => c.id === item.unlockRequirement) : null;

          return (
            <div key={i} onClick={() => setSelectedItem(selectedItem === i ? null : i)}
              style={{ background:selectedItem===i?"#1c1a10":"#141814", border:"1px solid", borderColor:selectedItem===i ? vendor.color : locked ? "#1a1a1a" : "#1e2320", borderRadius:8, padding:"12px 16px", cursor:"pointer", transition:"all 0.2s", opacity:locked ? 0.4 : 1 }}>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ flex:1 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <span style={{ fontSize:14, fontWeight:600, color:locked ? "#4a4a4a" : "#e8dfc8" }}>{item.name}</span>
                    {locked && isChestGated && chestInfo && (
                      <span style={{ fontSize:10, color:chestInfo.color+"99", background:"#111", border:`1px solid ${chestInfo.color}44`, padding:"2px 8px", borderRadius:8 }}>
                        🔒 {chestInfo.icon} {chestInfo.name}
                      </span>
                    )}
                    {locked && !isChestGated && (
                      <span style={{ fontSize:10, color:"#5a3a2a", background:"#1a1010", border:"1px solid #2a1a1a", padding:"2px 8px", borderRadius:8 }}>🔒 LOCKED</span>
                    )}
                  </div>
                  <div style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#5a6a4a", marginTop:2 }}>{item.use}</div>
                </div>
                <div style={{ textAlign:"right", flexShrink:0 }}>
                  <div style={{ fontSize:16, fontWeight:700, color:locked ? "#4a4a2a" : "#d4aa60", fontFamily:"'Crimson Text',serif" }}>{item.price}</div>
                  <div style={{ fontSize:10, color:"#4a4a3a" }}>🪙 coins</div>
                </div>
                <span style={{ fontSize:14, color:selectedItem===i ? vendor.color : "#3a3a2a", marginLeft:4 }}>{selectedItem===i ? "▲" : "▼"}</span>
              </div>

              {selectedItem === i && (
                <div style={{ marginTop:12, borderTop:"1px solid #2a2a1a", paddingTop:12 }}>
                  <p style={{ fontFamily:"'Crimson Text',serif", fontSize:13, color:"#8a7a60", fontStyle:"italic", lineHeight:1.5, marginBottom: locked ? 10 : 0 }}>{item.desc}</p>
                  {locked && item.unlockTip && (
                    <div style={{ background:"#120e0e", border:"1px solid #2a1a1a", borderRadius:6, padding:"8px 12px" }}>
                      <div style={{ fontSize:10, color: isChestGated ? "#6a5a2a" : "#6a2a2a", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>
                        {isChestGated ? "📜 How to unlock" : "🔒 How to unlock"}
                      </div>
                      <div style={{ fontFamily:"'Crimson Text',serif", fontSize:13, color: isChestGated ? "#aaaa6a" : "#aa6a4a", lineHeight:1.5 }}>{item.unlockTip}</div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    return <VendorDetail vendor={vendor} bosses={bosses} onBack={() => setActiveVendor(null)} />;
  }

  return (
    <div>
      <p style={{ fontFamily:"'Crimson Text',serif", color:"#5a5a4a", fontSize:14, fontStyle:"italic", marginBottom:22 }}>
        Three merchants roam Valheim — find them, build a portal, and get rich
      </p>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(260px, 1fr))", gap:16 }}>
        {vendors.map(vendor => {
          // Count locked vs available items
          const bossMap = { defeat_elder:2, defeat_bonemass:3, defeat_moder:4, defeat_yagluth:5, defeat_queen:6, defeat_fader:7 };

          return (

              </div>

              {/* Item count */}
              <div style={{ display:"flex", gap:10, marginBottom:14 }}>

                  <div style={{ fontSize:10, color:"#4a6a3a", letterSpacing:1 }}>available</div>
                </div>

                    <div style={{ fontSize:10, color:"#5a3a2a", letterSpacing:1 }}>locked</div>
                  </div>
                )}
              </div>

              {/* Location hint */}
              <div style={{ fontFamily:"'Crimson Text',serif", fontSize:12, color:"#4a5a4a", lineHeight:1.5, fontStyle:"italic" }}>
                {vendor.location.split(".")[0]}.
              </div>
            </div>
          );

      </div>
    </div>
  );

// ─── Tab bar with dynamic scroll arrows ──────────────────────────────────────
function TabBar({ mainTabs, tab, setTab }) {
  const [showLeft, setShowLeft]   = useState(false);
  const [showRight, setShowRight] = useState(true);

  const handleScroll = (e) => {
    const el = e.currentTarget;
    setShowLeft(el.scrollLeft > 10);
    setShowRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 10);
  };

  const ARROW = { color:"#d4aa60", fontSize:24, fontWeight:700, lineHeight:1, animation:"pulse 1.8s ease-in-out infinite" };

  return (
    <div style={{ position:"relative", marginTop:8 }}>
      <div className="tab-bar" onScroll={handleScroll}>
        {mainTabs.map(t => (
          <button key={t.id} className={`tab-btn ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
      {/* Left fade */}
      <div style={{ position:"absolute", left:0, top:0, bottom:0, width:64, background:"linear-gradient(to left, transparent, #0d0f0e)", pointerEvents:"none", display:"flex", alignItems:"center", justifyContent:"flex-start", paddingLeft:8, opacity:showLeft?1:0, transition:"opacity 0.2s" }}>
        <span style={ARROW}>‹</span>
      </div>
      {/* Right fade */}
      <div style={{ position:"absolute", right:0, top:0, bottom:0, width:64, background:"linear-gradient(to right, transparent, #0d0f0e)", pointerEvents:"none", display:"flex", alignItems:"center", justifyContent:"flex-end", paddingRight:8, opacity:showRight?1:0, transition:"opacity 0.2s" }}>
        <span style={ARROW}>›</span>
      </div>
    </div>
  );
}

            <span style={{ marginLeft:"auto", fontSize:11, color:"#3a4a3a", fontFamily:"'Crimson Text',serif" }}>{allItems.length} items</span>
          </div>
          <div className="rune-divider">᛫ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᛫</div>
          <TabBar mainTabs={mainTabs} tab={tab} setTab={setTab} />
        </div>
      </div>
      <div style={{ maxWidth:980, margin:"0 auto", padding:"24px 24px 48px" }}>
        {tab==="tracker" && (
          <div>
            <div style={{ marginBottom:28, padding:"16px 20px", background:"#141814", borderRadius:8, border:"1px solid #1e2320" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                <span style={{ fontFamily:"'Crimson Text',serif", color:"#8a7a5a", fontStyle:"italic" }}>Your saga progress</span>
                <span style={{ color:"#d4aa60", fontWeight:600, fontSize:14 }}>{defeatedCount} / {bosses.length} defeated</span>
              </div>
              <div className="progress-bar-bg"><div className="progress-bar-fill" style={{ width:`${(defeatedCount/bosses.length)*100}%` }}/></div>
              {defeatedCount===bosses.length && <div style={{ textAlign:"center", marginTop:12, color:"#d4aa60", fontStyle:"italic", fontFamily:"'Crimson Text',serif", fontSize:15 }}>✦ Odin is proud. All worlds conquered. ✦</div>}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(260px, 1fr))", gap:14 }}>
              {bosses.map(boss=>(
                <div key={boss.id} onClick={()=>toggleBoss(boss.id)}
                  style={{ background:"linear-gradient(135deg,#1a1f1a 0%,#141814 100%)", border:`1px solid ${boss.defeated?"#3a4a2a":"#2a2f2a"}`, borderRadius:8, padding:18, cursor:"pointer", transition:"all 0.25s", position:"relative", overflow:"hidden" }}>
                  {/* Top section — dimmed when defeated */}
                  <div style={{ opacity:boss.defeated?0.45:1, transition:"opacity 0.25s" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                      <span style={{ fontSize:32 }}>{boss.icon}</span>
                      <div>
                        <div style={{ fontSize:16, fontWeight:600, color:"#e8dfc8", letterSpacing:1 }}>{boss.name}</div>
                        <div style={{ fontSize:11, color:BIOME_COLORS[boss.biome]||"#8a7a5a", letterSpacing:2, textTransform:"uppercase", fontFamily:"'Crimson Text',serif" }}>{boss.biome}</div>
                      </div>
                      {boss.defeated && <div style={{ marginLeft:"auto", fontSize:10, color:"#d4aa60", border:"1px solid #d4aa60", padding:"2px 8px", borderRadius:10, fontFamily:"'Crimson Text',serif", opacity:1 }}>SLAIN</div>}
                    </div>
                    <div style={{ fontFamily:"'Crimson Text',serif", fontSize:14, color:"#7a7060", fontStyle:"italic", marginBottom:10, lineHeight:1.4 }}>💡 {boss.tip}</div>
                    <div style={{ borderTop:"1px solid #1e2320", paddingTop:10, display:"flex", flexDirection:"column", gap:4 }}>
                      <div style={{ fontSize:12, color:"#5a7a5a" }}>⚡ <span style={{ color:"#8a9a8a" }}>{boss.power}</span></div>
                      <div style={{ fontSize:12, color:"#7a6a4a" }}>🎁 <span style={{ color:"#a08a6a" }}>{boss.drop}</span></div>
                    </div>
                  </div>
                  {/* Unlocks — always full opacity */}
                  {boss.defeated && boss.unlocks && (
                    <div style={{ marginTop:10, borderTop:"1px solid #2a3a1a", paddingTop:10, display:"flex", flexDirection:"column", gap:4 }}>
                      <div style={{ fontSize:10, color:"#4a8a3a", letterSpacing:2, textTransform:"uppercase", marginBottom:4 }}>✦ Unlocked</div>
                      {boss.unlocks.map((u, idx) => (
                        <div key={idx} style={{ fontSize:12, color:"#8acc6a", fontFamily:"'Crimson Text',serif", display:"flex", gap:6, lineHeight:1.4 }}>
                          <span style={{ color:"#4a8a3a", flexShrink:0, marginTop:1 }}>▸</span>{u}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
            <p style={{ marginTop:16, textAlign:"center", fontFamily:"'Crimson Text',serif", fontSize:13, color:"#3a3a2a", fontStyle:"italic" }}>Click a card to mark as defeated · progress syncs to Weapons & Armor tabs</p>
          </div>
        )}
        {tab==="weapons"   && <WeaponsPanel key="weapons" bosses={bosses} weaponCategories={weaponCategories} allItems={allItems}/>}
        {tab==="armor"     && <ArmorPanel   key="armor"   bosses={bosses} armorSets={armorSets} allItems={allItems}/>}
        {tab==="food"      && <FoodPanel key="food" bosses={bosses} foodCategories={foodCategories} allItems={allItems}/>}
        {tab==="materials" && <MaterialsPanel key="materials" allItems={allItems}/>}
        {tab==="vendors"   && <VendorsPanel key="vendors" vendors={vendorsData} bosses={bosses}/>}
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ValheimApp));
  </script>
</body>
</html>
