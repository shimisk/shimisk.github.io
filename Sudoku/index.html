<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f9c6d0" />
  <meta name="description" content="Sudoku — a cute daily sudoku PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sudoku" />
  <title>Sudoku 🍓</title>

  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/logo.png" />
  <link rel="shortcut icon" href="assets/images/logo.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/overlays.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-blobs">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>
  <div class="deco-float deco1">🌸</div>
  <div class="deco-float deco2">⭐</div>
  <div class="deco-float deco3">🍓</div>
  <div class="deco-float deco4">🌷</div>

  <a
    class="store-link"
    href="../index.html"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open app storefront"
    title="Open storefront"
  >🛍️</a>

  <div class="app">

    <!-- ═══════════════════════════════════════
         SCREEN: Home
    ═══════════════════════════════════════ -->
    <div class="screen" id="screen-home">

      <div class="home-header">
        <img src="assets/images/logo.png" class="logo-img" alt="Sudoku" />
      </div>

      <div class="streak-banner">
        <div class="streak-item">
          <div class="streak-emoji">🔥</div>
          <div class="streak-info">
            <div class="streak-num" id="streak-easy">0</div>
            <div class="streak-label">Easy streak</div>
          </div>
        </div>
        <div class="streak-divider"></div>
        <div class="streak-item">
          <div class="streak-emoji">✨</div>
          <div class="streak-info">
            <div class="streak-num" id="streak-medium">0</div>
            <div class="streak-label">Medium streak</div>
          </div>
        </div>
        <div class="streak-divider"></div>
        <div class="streak-item">
          <div class="streak-emoji">💎</div>
          <div class="streak-info">
            <div class="streak-num" id="streak-hard">0</div>
            <div class="streak-label">Hard streak</div>
          </div>
        </div>
      </div>

      <div class="mode-cards">
        <button class="mode-card mode-easy">
          <img src="assets/images/icon-easy.png" class="mode-img" alt="Easy" />
          <div>
            <div class="mode-name">Easy</div>
            <div class="mode-desc">warm up, sweetie~</div>
          </div>
          <div class="mode-info">
            <div class="mode-status" id="status-easy"></div>
          </div>
        </button>

        <button class="mode-card mode-medium">
          <img src="assets/images/icon-medium.png" class="mode-img" alt="Medium" />
          <div>
            <div class="mode-name">Medium</div>
            <div class="mode-desc">you got this! ♡</div>
          </div>
          <div class="mode-info">
            <div class="mode-status" id="status-medium"></div>
          </div>
        </button>

        <button class="mode-card mode-hard">
          <img src="assets/images/icon-hard.png" class="mode-img" alt="Hard" />
          <div>
            <div class="mode-name">Hard</div>
            <div class="mode-desc">big brain time~</div>
          </div>
          <div class="mode-info">
            <div class="mode-status" id="status-hard"></div>
          </div>
        </button>
      </div>

      <div class="home-footer">
        <div class="daily-date" id="daily-date"></div>
        <div class="home-note">new puzzles every day at midnight 🌙</div>
      </div>

    </div><!-- /screen-home -->


    <!-- ═══════════════════════════════════════
         SCREEN: Game
    ═══════════════════════════════════════ -->
    <div class="screen" id="screen-game">

      <div class="game-topbar">
        <button class="btn-back" id="btn-back">← back</button>
        <div class="game-mode-badge" id="game-mode-badge">Easy</div>
        <div class="game-timer" id="game-timer">0:00</div>
      </div>

      <div class="game-info-row">
        <div class="mistakes-display">
          <span class="mistakes-label">mistakes</span>
          <div class="mistake-dots" id="mistake-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        <button class="btn-note-mode" id="btn-note-mode">✏️ notes</button>
        <button class="btn-hint" id="btn-hint">
          💡 hint <span id="hint-count">(3)</span>
        </button>
      </div>

      <div class="board-wrapper">
        <div class="sudoku-board" id="sudoku-board"></div>
      </div>

      <div class="numpad" id="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="num-btn erase-btn" data-num="0">⌫</button>
      </div>

    </div><!-- /screen-game -->


    <!-- ═══════════════════════════════════════
         SCREEN: Win
    ═══════════════════════════════════════ -->
    <div class="screen" id="screen-win">
      <div class="win-content">
        <div class="win-emoji" id="win-emoji">🎉</div>
        <h2 class="win-title">You did it!</h2>
        <p class="win-sub" id="win-sub">Puzzle complete~</p>
        <div class="win-stats">
          <div class="win-stat">
            <div class="win-stat-val" id="win-time">0:00</div>
            <div class="win-stat-label">time</div>
          </div>
          <div class="win-stat">
            <div class="win-stat-val" id="win-mistakes">0</div>
            <div class="win-stat-label">mistakes</div>
          </div>
          <div class="win-stat">
            <div class="win-stat-val" id="win-streak">🔥1</div>
            <div class="win-stat-label">streak</div>
          </div>
        </div>
        <div class="win-confetti" id="win-confetti"></div>
        <button class="btn-home" id="btn-win-home">back to garden 🌸</button>
      </div>
    </div><!-- /screen-win -->


    <!-- ═══════════════════════════════════════
         OVERLAY: Loss
    ═══════════════════════════════════════ -->
    <div class="loss-overlay" id="loss-overlay">
      <div class="loss-card">
        <div class="loss-emoji">💔</div>
        <h2 class="loss-title">Too many mistakes~</h2>
        <p class="loss-sub">The solution has been revealed.</p>
        <p class="loss-note">Come back tomorrow for a new puzzle! 🌙</p>
        <button class="btn-home" id="btn-loss-home">back to garden 🌸</button>
      </div>
    </div>

  </div><!-- /app -->

  <!-- Entry point (ES module) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
