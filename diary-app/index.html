<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#9b59b6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Diary" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <title>My Diary</title>

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />

    <!-- Import map: resolve bare specifiers to CDN -->
    <script type="importmap">
    {
      "imports": {
        "react":            "https://esm.sh/react@18.3.1?dev",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?dev"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script src="../shared/ios-picker-layer.js"></script>

    <!--
      Main entry point - pure ES modules, no JSX/Babel needed.
    -->
    <script type="module" src="src/main.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js")
            .then(registration => {
              console.log("SW registered:", registration.scope);

              const activateWaitingWorker = () => {
                if (registration.waiting) {
                  registration.waiting.postMessage({ type: "SKIP_WAITING" });
                }
              };

              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener("statechange", () => {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    activateWaitingWorker();
                  }
                });
              });

              if (navigator.onLine) {
                registration.update().catch(() => {});
              }

              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  registration.update().catch(() => {});
                }
              });

              window.addEventListener("focus", () => {
                registration.update().catch(() => {});
              });

              setInterval(() => {
                registration.update().catch(() => {});
              }, 30 * 60 * 1000);
            })
            .catch(e => console.warn("SW failed:", e));
        });

        let reloadedForUpdate = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadedForUpdate) return;
          reloadedForUpdate = true;
          window.location.reload();
        });
      }
    </script>

    <script type="module" src="../feedback/widget.js"></script>
  </body>
</html>
