<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact</title>
		<link rel="icon" type="/image/png" href="/Images/symfavicon.ico" />
		<!-- Bootsrap CSS -->

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="/Css/style.css" />
		<script
			src="https://kit.fontawesome.com/ec18948b8a.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<!-- NAVBAR -->
		<nav></nav>

		<!-- HEADER -->
		<header></header>

		<main class="container-fluid py-5">
			<div class="row justify-content-center">
				<div class="col-sm-10 col-lg-8">
					<h1 class="display-6">
						Contact Us<br />
						お問い合わせ
					</h1>
					<hr />
					<p>
						お問い合わせは日本語でどうぞ。お電話でも承ります(<a
							href="tel:03-3469-7151"
							>03-3469-7151</a
						>)。
					</p>
					<p>
						無理な営業はいたしません。ご質問や疑問にはすべてお答えいたします。
					</p>
				</div>
			</div>
			<div class="row mt-5">
				<div class="col-md-6">
					<form
						action="https://formspree.io/f/mnqlpovv"
						method="POST"
						class="needs-validation left-align d-block"
						novalidate
					>
						<div class="mb-3">
							<label for="name" class="form-label"
								>*お名前(漢字)</label
							>
							<input
								type="text"
								class="form-control"
								id="name"
								name="name"
								required
							/>
							<div class="invalid-feedback">
								名前を入力してください
							</div>
						</div>
						<div class="mb-3">
							<label for="alphabet-name" class="form-label"
								>お名前(アルファベット)</label
							>
							<input
								type="text"
								class="form-control"
								id="alphabet-name"
								name="alphabet-name"
							/>
						</div>
						<div class="mb-3">
							<label for="phone" class="form-label"
								>電話番号(メールエラーの場合にお電話差し上げます)</label
							>
							<input
								type="tel"
								pattern="\d*"
								class="form-control"
								id="phone"
								name="phone"
							/>
						</div>
						<div class="mb-3">
							<label for="email" class="form-label"
								>*メールアドレス</label
							>
							<input
								type="email"
								class="form-control"
								id="email"
								name="email"
								required
							/>
							<div id="emailText" class="invalid-feedback"></div>
						</div>
						<div class="mb-3">
							<label for="confirm_email" class="form-label"
								>*メールアドレス(確認用)</label
							>
							<input
								type="email"
								class="form-control"
								id="confirm_email"
								required
							/>
							<div class="invalid-feedback">
								メールアドレスが一致しません
							</div>
						</div>
						<div class="mb-3">
							<label for="message" class="form-label"
								>*お問い合わせ内容</label
							>
							<textarea
								class="form-control"
								id="message"
								rows="3"
								name="Message"
								required
							></textarea>
							<div class="invalid-feedback">
								お問い合わせ内容を入力してください
							</div>
						</div>
						<div class="col-12">
							<button
								class="btn btn-lg btn-primary"
								type="submit"
							>
								送信
							</button>
						</div>
					</form>
				</div>
				<div class="col-5 my-5 pb-5 align-self-center">
					<iframe
						script="SameSite=None; Secure"
						src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3241.312831036614!2d139.68602365119196!3d35.669298438135975!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018f34b9b88c5cd%3A0x270eacb26fb99874!2z44K544OU44O844KvIOODpuOCoiDjg57jgqTjg7Pjg4noi7HkvJroqbHjgrnjgq_jg7zjg6vjgIHmuIvosLc!5e0!3m2!1sen!2sjp!4v1621409204053!5m2!1sen!2sjp"
						style="border: 0"
						allowfullscreen=""
						loading="lazy"
					></iframe>
				</div>
			</div>
		</main>

		<!-- FOOTER -->
		<footer></footer>
		<!-- Bootsrap and jQuery -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.min.js"
			integrity="sha384-Atwg2Pkwv9vp0ygtn1JAojH0nYbwNJLPhwyoVbhoPwBhjQPR5VtM2+xf0Uwh9KtT"
			crossorigin="anonymous"
		></script>
		<script
			src="https://code.jquery.com/jquery-3.6.0.min.js"
			integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
			crossorigin="anonymous"
		></script>
		<script src="/Scripts/Script.js"></script>
		<script src="/Scripts/validation.js"></script>
	</body>
</html>
