<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f0e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Valheim" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="companion/panels.css" />
  <link rel="stylesheet" href="companion/panels/food-panel.css" />
  <link rel="stylesheet" href="companion/panels/armor-panel.css" />
  <link rel="stylesheet" href="companion/panels/materials-panel.css" />
  <link rel="stylesheet" href="companion/panels/vendors-panel.css" />
  <link rel="stylesheet" href="companion/panels/taming-panel.css" />
  <link rel="stylesheet" href="companion/panels/farming-panel.css" />
  <title>Valheim Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0f0e; }
    #root { min-height: 100vh; }
    .boot {
      min-height: 100vh;
      color: #d4aa60;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      background: radial-gradient(ellipse at top,#1a1f1a 0%,#0d0f0e 70%);
    }

    .boot-inner {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .boot small {
      display: block;
      margin-top: 8px;
      font-family: 'Crimson Text', serif;
      color: #6a5a3a;
      letter-spacing: 1px;
      text-align: center;
    }

    .store-link-vh {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #1a1f1a;
      border: 1px solid #5a4a2a;
      color: #d4aa60;
      font-size: 18px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .store-link-vh:hover {
      transform: translateY(-2px);
      border-color: #d4aa60;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.52), 0 0 0 1px rgba(212, 170, 96, 0.25) inset;
    }
  </style>
</head>
<body>
  <a
    class="store-link-vh"
    href="https://shimisk.github.io/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open app storefront"
    title="Open storefront"
  >ᚠ</a>

  <div id="root" class="boot">
    <div class="boot-inner">
      <div>
      VALHEIM COMPANION
      <small>Loading live JSON data...</small>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script>
    if ("serviceWorker" in navigator) {
      let reloading = false;

      const onControllerChange = () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      };

      navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((registration) => {
          const requestUpdateCheck = () => {
            registration.update().catch(() => {});
          };

          window.addEventListener("focus", requestUpdateCheck);
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") requestUpdateCheck();
          });

          // Trigger an explicit check right after registration completes.
          requestUpdateCheck();
        }).catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
  <script>
    const DATA_FILES = ["bosses", "weapons", "armor", "food", "materials", "vendors", "weaponCategories", "foodCategories"];
    const APP_SOURCE_FILES = [
      "constants.jsx",
      "companion/panels/armor-panel.jsx",
      "companion/panels/weapons-panel.jsx",
      "companion/panels/food-panel.jsx",
      "companion/panels/materials-panel.jsx",
      "companion/panels/vendors-panel.jsx",
      "companion/panels/taming-panel.jsx",
      "companion/panels/farming-panel.jsx",
      "companion/panels/tab-bar.jsx",
      "companion/ui-panels.jsx",
      "valheim-companion.jsx"
    ];
    const NO_STORE_CACHE = { cache: "no-store" };

    function toConstName(name) {
      return name.replace(/([A-Z])/g, "_$1").toUpperCase();
    }

    function buildDataBlock(dataMap) {
      const lines = [
        "// ─── Inlined game data ────────────────────────────────────────────────────────",
        "// Runtime-loaded from /data/*.json at page load (no build step needed).",
        "// Edit JSON files and refresh this page.",
        "",
      ];
      for (const f of DATA_FILES) {
        const key = `_${toConstName(f)}_DATA`;
        const compact = JSON.stringify(dataMap[f]);
        lines.push(`const ${key} = ${compact};`);
      }
      return lines.join("\n");
    }

    async function fetchJson(path) {
      const res = await fetch(path, NO_STORE_CACHE);
      if (!res.ok) throw new Error(`Failed loading ${path} (${res.status})`);
      return res.json();
    }

    async function fetchText(path) {
      const res = await fetch(path, NO_STORE_CACHE);
      if (!res.ok) throw new Error(`Failed loading ${path} (${res.status})`);
      return res.text();
    }

    async function loadJsonData() {
      const entries = await Promise.all(DATA_FILES.map(async (f) => {
        const json = await fetchJson(`data/${f}.json`);
        return [f, json];
      }));
      return Object.fromEntries(entries);
    }

    async function loadAppSources() {
      return Promise.all(APP_SOURCE_FILES.map((file) => fetchText(file)));
    }

    function normalizeNewlines(text) {
      return text.replace(/\r\n/g, "\n");
    }

    function stripReactImportAndHookAlias(jsxSource) {
      let output = jsxSource;
      output = output.replace(/^import\s+[^;]+;\n?/gm, "");
      output = output.replace(/^export\s+\{[^}]+\};\n?/gm, "");
      output = output.replace(/^export\s+(?=(const|function|class)\b)/gm, "");
      output = output.replace(/^const\s+\{\s*useState[^\n]*\n\n?/m, "");
      return output;
    }

    function stripInlinedDataBlock(jsxSource) {
      return jsxSource.replace(/\nconst _[A-Z_]+_DATA = [\s\S]*?\nfunction useGameData\(\)/, "\nfunction useGameData()");
    }

    function injectRuntimeDataBlock(jsxSource, dataBlock) {
      const markerPattern = /\/\/ ─── Inlined game data[\s\S]*?\nfunction useGameData\(\)/;
      if (markerPattern.test(jsxSource)) {
        return jsxSource.replace(markerPattern, `${dataBlock}\n\nfunction useGameData()`);
      }
      // Fallback: inject directly before useGameData if marker comments were removed.
      return jsxSource.replace(/\nfunction useGameData\(\)/, `\n${dataBlock}\n\nfunction useGameData()`);
    }

    function convertDefaultExportToFunction(jsxSource) {
      return jsxSource.replace("export default function ValheimApp()", "function ValheimApp()");
    }

    function addUmdPreludeAndMount(jsxSource) {
      const prelude = "const { useState, useMemo, useEffect, useRef } = React;\n\n";
      const mount = "\n\nconst _root = ReactDOM.createRoot(document.getElementById('root'));\n_root.render(React.createElement(ValheimApp));\n";
      return prelude + jsxSource + mount;
    }

    function prepareRuntimeAppSource(jsxSourceRawList, dataBlock) {
      const joined = jsxSourceRawList.map(normalizeNewlines).join("\n\n");
      let jsxSource = joined;
      jsxSource = stripReactImportAndHookAlias(jsxSource);
      jsxSource = stripInlinedDataBlock(jsxSource);
      jsxSource = injectRuntimeDataBlock(jsxSource, dataBlock);
      jsxSource = convertDefaultExportToFunction(jsxSource);
      jsxSource = addUmdPreludeAndMount(jsxSource);
      return jsxSource;
    }

    function compileJsxToJs(jsxSource) {
      return Babel.transform(jsxSource, {
        plugins: ["transform-react-jsx"]
      }).code;
    }

    async function boot() {
      const [dataMap, appSourceRawList] = await Promise.all([
        loadJsonData(),
        loadAppSources()
      ]);

      const dataBlock = buildDataBlock(dataMap);
      const jsxSource = prepareRuntimeAppSource(appSourceRawList, dataBlock);
      const compiled = compileJsxToJs(jsxSource);

      // eslint-disable-next-line no-new-func
      new Function(compiled)();
    }

    boot().catch((err) => {
      const root = document.getElementById("root");
      root.className = "boot";
      root.innerHTML = `<div>LOAD FAILED<small>${String(err && err.message ? err.message : err)}</small></div>`;
      console.error(err);
    });
  </script>

  <script type="module" src="../feedback/widget.js"></script>
</body>
</html>
