<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#FF6B6B"/>
<title>BlogSwipe – Find Bloggers You Love</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="blogswipe.css"/>
</head>
<body>

<header>
  <div class="logo">Blog<span>Swipe</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="settingsBtn" title="Change interests">⚙️</button>
  </div>
</header>

<!-- ONBOARDING -->
<div class="screen active" id="onboarding">
  <div class="ob-title">What are you<br/><span>into?</span></div>
  <div class="ob-sub">Pick your interests — we'll find bloggers you'll love</div>
  <div class="tags-grid" id="tagsGrid"></div>
  <button class="ob-btn" id="startBtn" disabled>Find My Bloggers 🚀</button>
</div>

<!-- SWIPE -->
<div class="screen" id="swipe">
  <div class="tag-filter-bar" id="filterBar"></div>
  <div class="card-stack" id="cardStack">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div style="color:#888;font-size:.9rem">Fetching bloggers…</div>
    </div>
  </div>
  <div class="action-bar">
    <button class="action-btn btn-skip" id="skipBtn" title="Skip">❌</button>
    <button class="action-btn btn-info" id="openBtn" title="Open blog">🔗</button>
    <button class="action-btn btn-save" id="saveBtn" title="Save">💚</button>
  </div>
</div>

<!-- SAVED -->
<div class="screen" id="saved">
  <div class="section-title">💚 Saved Bloggers</div>
  <div id="savedList"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" id="bottomNav" style="display:none">
  <button class="nav-tab active" data-screen="swipe">
    <span class="tab-icon">🃏</span>DISCOVER
  </button>
  <button class="nav-tab" data-screen="saved">
    <span class="tab-icon">💚</span>SAVED
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────
const DEVTO_API   = 'https://dev.to/api';
const RSS2JSON    = 'https://api.rss2json.com/v1/api.json?rss_url=';
const HASHNODE_GQL= 'https://gql.hashnode.com';

const ALL_INTERESTS = [
  {label:'🎮 Gaming',     tag:'gaming'},
  {label:'✈️ Travel',     tag:'travel'},
  {label:'🍜 Food',       tag:'food'},
  {label:'💻 Tech',       tag:'technology'},
  {label:'🤖 AI',         tag:'ai'},
  {label:'🎨 Design',     tag:'design'},
  {label:'🏃 Fitness',    tag:'fitness'},
  {label:'📸 Photography',tag:'photography'},
  {label:'🎵 Music',      tag:'music'},
  {label:'📚 Books',      tag:'books'},
  {label:'🌿 Nature',     tag:'nature'},
  {label:'💰 Finance',    tag:'finance'},
  {label:'🚀 Startup',    tag:'startup'},
  {label:'🧠 Science',    tag:'science'},
  {label:'🎬 Movies',     tag:'movies'},
  {label:'🌍 Culture',    tag:'culture'},
  {label:'🐾 Pets',       tag:'pets'},
  {label:'🏠 Home',       tag:'home'},
  {label:'💄 Beauty',     tag:'beauty'},
  {label:'⚽ Sports',     tag:'sports'},
  {label:'🧘 Wellness',   tag:'wellness'},
  {label:'📝 Writing',    tag:'writing'},
  {label:'🐍 Python',     tag:'python'},
  {label:'🌐 Web Dev',    tag:'webdev'},
  {label:'🎯 Productivity',tag:'productivity'},
];

const TAG_COLORS = ['tc0','tc1','tc2','tc3','tc4','tc5','tc6','tc7'];
const tagColor = t => TAG_COLORS[Math.abs([...t].reduce((a,c)=>a+c.charCodeAt(0),0)) % TAG_COLORS.length];

// ── STATE ───────────────────────────────────────────
let selectedInterests = JSON.parse(localStorage.getItem('bs_interests')||'[]');
let savedItems = JSON.parse(localStorage.getItem('bs_saved')||'[]');
let posts = [];
let currentFilter = 'all';
let visiblePosts = [];
let topCardEl = null;
let isDragging = false, startX=0, startY=0, currentX=0;

// ── ONBOARDING ──────────────────────────────────────
const tagsGrid = document.getElementById('tagsGrid');
const startBtn = document.getElementById('startBtn');

function buildOnboarding() {
  tagsGrid.innerHTML = '';
  ALL_INTERESTS.forEach(({label, tag}) => {
    const pill = document.createElement('button');
    pill.className = 'tag-pill' + (selectedInterests.includes(tag)?' selected':'');
    pill.textContent = label;
    pill.onclick = () => {
      if(selectedInterests.includes(tag)) {
        selectedInterests = selectedInterests.filter(t=>t!==tag);
        pill.classList.remove('selected');
      } else {
        selectedInterests.push(tag);
        pill.classList.add('selected');
      }
      startBtn.disabled = selectedInterests.length === 0;
    };
    tagsGrid.appendChild(pill);
  });
  startBtn.disabled = selectedInterests.length === 0;
}

startBtn.onclick = () => {
  localStorage.setItem('bs_interests', JSON.stringify(selectedInterests));
  showScreen('swipe');
  loadPosts();
};

document.getElementById('settingsBtn').onclick = () => showScreen('onboarding');

// ── SCREEN ROUTING ───────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const nav = document.getElementById('bottomNav');
  nav.style.display = (id==='onboarding') ? 'none' : 'flex';
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.screen===id);
  });
  if(id==='saved') renderSaved();
}

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.onclick = () => showScreen(tab.dataset.screen);
});

// ── DATA FETCHING ────────────────────────────────────
async function fetchDevTo(tag) {
  try {
    const r = await fetch(`${DEVTO_API}/articles?tag=${tag}&per_page=12&top=7`);
    const data = await r.json();
    return data.filter(a=>a.user).map(a=>({
      id: 'devto_'+a.id,
      author: a.user.name,
      handle: '@'+a.user.username,
      avatar: a.user.profile_image_90||'',
      title: a.title,
      desc: a.description||'',
      url: a.url,
      banner: a.cover_image||a.social_image||'',
      tags: a.tag_list?.slice(0,4)||[tag],
      source: 'Dev.to',
      reads: a.public_reactions_count||0,
    }));
  } catch(e){ return []; }
}

async function fetchHashnode(tag) {
  try {
    const q = `{ tagFeed(slug:"${tag}", type:HOT) { edges { node { title brief author { name username profilePicture } coverImage { url } url tags { name } } } } }`;
    const r = await fetch(HASHNODE_GQL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    const {data} = await r.json();
    return (data?.tagFeed?.edges||[]).map(({node:a},i)=>({
      id: 'hn_'+tag+i,
      author: a.author?.name||'Unknown',
      handle: '@'+(a.author?.username||''),
      avatar: a.author?.profilePicture||'',
      title: a.title,
      desc: a.brief||'',
      url: a.url,
      banner: a.coverImage?.url||'',
      tags: a.tags?.map(t=>t.name).slice(0,4)||[tag],
      source: 'Hashnode',
      reads: 0,
    }));
  } catch(e){ return []; }
}

async function fetchRSS(url, tag, source) {
  try {
    const r = await fetch(`${RSS2JSON}${encodeURIComponent(url)}&api_key=&count=10`);
    const data = await r.json();
    if(data.status!=='ok') return [];
    return (data.items||[]).map((item,i)=>({
      id: source+'_'+tag+i,
      author: item.author||data.feed?.title||source,
      handle: '',
      avatar: data.feed?.image||'',
      title: item.title,
      desc: item.description?.replace(/<[^>]+>/g,'').slice(0,200)||'',
      url: item.link,
      banner: item.thumbnail||item.enclosure?.link||'',
      tags: item.categories?.slice(0,4)||[tag],
      source,
      reads: 0,
    }));
  } catch(e){ return []; }
}

// Medium top-writers RSS per tag
function mediumRSSUrl(tag) {
  return `https://medium.com/feed/tag/${tag}`;
}

async function loadPosts() {
  const stack = document.getElementById('cardStack');
  stack.innerHTML = '<div class="loader"><div class="spinner"></div><div style="color:#888;font-size:.9rem">Fetching bloggers…</div></div>';

  const tags = selectedInterests.slice(0,5); // limit API calls
  const allResults = await Promise.all(tags.flatMap(tag=>[
    fetchDevTo(tag),
    fetchHashnode(tag),
    fetchRSS(mediumRSSUrl(tag), tag, 'Medium'),
  ]));

  const flat = allResults.flat();
  // dedupe by id
  const seen = new Set();
  posts = flat.filter(p=>{ if(seen.has(p.id)) return false; seen.add(p.id); return true; });
  // shuffle
  posts = posts.sort(()=>Math.random()-.5);

  buildFilterBar();
  applyFilter(currentFilter);
}

// ── FILTER BAR ───────────────────────────────────────
function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'filter-pill active'; all.textContent = '✨ All';
  all.onclick = () => applyFilter('all');
  bar.appendChild(all);

  const sources = [...new Set(posts.map(p=>p.source))];
  sources.forEach(src => {
    const b = document.createElement('button');
    b.className = 'filter-pill';
    b.textContent = {Dev:{emoji:'👾'},'Ha':{emoji:'🟣'},'Me':{emoji:'🟢'}}[src.slice(0,2)]?.emoji||'📄';
    b.textContent += ' '+src;
    b.onclick = () => applyFilter(src);
    bar.appendChild(b);
  });
}

function applyFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-pill').forEach(p=>{
    p.classList.toggle('active',
      (filter==='all' && p.textContent.includes('All')) ||
      p.textContent.includes(filter)
    );
  });
  visiblePosts = filter==='all' ? [...posts] : posts.filter(p=>p.source===filter);
  renderCards();
}

// ── CARD RENDERING ────────────────────────────────────
function renderCards() {
  const stack = document.getElementById('cardStack');
  stack.innerHTML = '';

  if(!visiblePosts.length) {
    stack.innerHTML = `<div class="empty-state">
      <div class="big">🎉</div>
      <h3>You've seen them all!</h3>
      <p>Change your interests or reload to find more.</p>
      <button class="reload-btn" onclick="loadPosts()">Reload ↻</button>
    </div>`;
    return;
  }

  // render up to 3 cards (top visible)
  visiblePosts.slice(0,3).reverse().forEach((post,i) => {
    const card = buildCard(post, i);
    stack.appendChild(card);
  });

  topCardEl = stack.querySelector('.blog-card:last-child');
  attachDrag(topCardEl);
}

function buildCard(post, stackIndex) {
  const el = document.createElement('div');
  el.className = 'blog-card';
  el.dataset.id = post.id;
  el.dataset.url = post.url;
  // stack effect
  const scale = 1 - stackIndex*0.04;
  const ty = stackIndex*8;
  el.style.transform = `scale(${scale}) translateY(${-ty}px)`;
  el.style.zIndex = 10 - stackIndex;

  const bannerBg = post.banner
    ? `<img class="card-banner-bg" src="${post.banner}" onerror="this.style.display='none'" loading="lazy"/>`
    : `<div style="background:${randomGrad()};width:100%;height:100%"></div>`;

  const avatarContent = post.avatar
    ? `<img src="${post.avatar}" onerror="this.innerHTML='🧑'" loading="lazy"/>`
    : `<span>${post.author.charAt(0).toUpperCase()}</span>`;

  const tagsHtml = post.tags.slice(0,3).map(t=>`<span class="card-tag ${tagColor(t)}">${t}</span>`).join('');

  el.innerHTML = `
    <div class="card-banner">
      ${bannerBg}
      <div class="card-banner-overlay"></div>
      <div class="card-avatar">${avatarContent}</div>
      <div class="card-source-badge">${post.source}</div>
    </div>
    <div class="swipe-label nope">NOPE</div>
    <div class="swipe-label save">SAVE</div>
    <div class="card-body">
      <div class="card-author">${escHtml(post.author)}</div>
      <div class="card-handle">${escHtml(post.handle)}</div>
      <div class="card-title">${escHtml(post.title)}</div>
      <div class="card-desc">${escHtml(post.desc)}</div>
      <div class="card-tags">${tagsHtml}</div>
      ${post.reads ? `<div class="card-meta"><span>❤️ ${post.reads}</span></div>` : ''}
    </div>`;
  return el;
}

function randomGrad() {
  const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#A855F7','#3B82F6','#EC4899','#10B981','#F97316'];
  const a = colors[Math.floor(Math.random()*colors.length)];
  const b = colors[Math.floor(Math.random()*colors.length)];
  return `linear-gradient(135deg,${a},${b})`;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── DRAG / SWIPE ─────────────────────────────────────
function attachDrag(card) {
  if(!card) return;
  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, {passive:true});
}

function onStart(e) {
  isDragging = true;
  const pt = e.touches?.[0]||e;
  startX = pt.clientX; startY = pt.clientY;
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function onMove(e) {
  if(!isDragging || !topCardEl) return;
  const pt = e.touches?.[0]||e;
  currentX = pt.clientX - startX;
  const dy = pt.clientY - startY;
  const rot = currentX * 0.08;
  topCardEl.style.transition = 'none';
  topCardEl.style.transform = `translateX(${currentX}px) translateY(${dy}px) rotate(${rot}deg)`;

  // feedback labels
  const nopeEl = topCardEl.querySelector('.nope');
  const saveEl = topCardEl.querySelector('.save');
  const ratio = Math.min(Math.abs(currentX)/120, 1);
  if(currentX < 0) { nopeEl.style.opacity=ratio; saveEl.style.opacity=0; }
  else              { saveEl.style.opacity=ratio; nopeEl.style.opacity=0; }
}

function onEnd() {
  isDragging = false;
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('touchmove', onMove);
  document.removeEventListener('mouseup', onEnd);
  document.removeEventListener('touchend', onEnd);

  if(!topCardEl) return;
  const threshold = 100;
  if(currentX > threshold)       doSwipe('right');
  else if(currentX < -threshold) doSwipe('left');
  else {
    topCardEl.style.transition = 'transform .35s cubic-bezier(.18,.89,.32,1.28)';
    topCardEl.style.transform = 'scale(1) translateY(0)';
    topCardEl.querySelector('.nope').style.opacity = 0;
    topCardEl.querySelector('.save').style.opacity = 0;
  }
  currentX = 0;
}

function doSwipe(dir) {
  if(!topCardEl) return;
  const postId = topCardEl.dataset.id;
  topCardEl.style.transition = 'transform .35s ease, opacity .35s';
  if(dir==='right') {
    topCardEl.classList.add('flying-right');
    savePost(postId);
    showToast('💚 Saved!');
  } else {
    topCardEl.classList.add('flying-left');
    showToast('👋 Skipped');
  }
  setTimeout(()=>{
    visiblePosts = visiblePosts.filter(p=>p.id!==postId);
    renderCards();
  }, 350);
}

// ── ACTION BUTTONS ───────────────────────────────────
document.getElementById('skipBtn').onclick = () => doSwipe('left');
document.getElementById('saveBtn').onclick = () => doSwipe('right');
document.getElementById('openBtn').onclick = () => {
  if(topCardEl) window.open(topCardEl.dataset.url, '_blank');
};

// ── SAVED ────────────────────────────────────────────
function savePost(id) {
  const post = posts.find(p=>p.id===id);
  if(!post || savedItems.find(s=>s.id===id)) return;
  savedItems.unshift(post);
  localStorage.setItem('bs_saved', JSON.stringify(savedItems));
}

function unsavePost(id) {
  savedItems = savedItems.filter(s=>s.id!==id);
  localStorage.setItem('bs_saved', JSON.stringify(savedItems));
  renderSaved();
}

function renderSaved() {
  const list = document.getElementById('savedList');
  if(!savedItems.length) {
    list.innerHTML = `<div class="saved-empty"><div class="big">💤</div><p>Swipe right on bloggers to save them here!</p></div>`;
    return;
  }
  list.innerHTML = '';
  savedItems.forEach(post => {
    const row = document.createElement('div');
    row.className = 'saved-card';
    const avatarContent = post.avatar
      ? `<img src="${post.avatar}" onerror="this.innerHTML='🧑'" loading="lazy"/>`
      : post.author.charAt(0).toUpperCase();
    row.innerHTML = `
      <div class="saved-avatar">${post.avatar ? `<img src="${escHtml(post.avatar)}" onerror="this.style.display='none'" loading="lazy"/>` : post.author.charAt(0)}</div>
      <div class="saved-info">
        <div class="saved-author">${escHtml(post.author)}</div>
        <div class="saved-title">${escHtml(post.title)}</div>
        <div class="saved-source">${escHtml(post.source)}</div>
      </div>
      <button class="unsave-btn" title="Remove">🗑️</button>`;
    row.querySelector('.saved-info').onclick = () => window.open(post.url,'_blank');
    row.querySelector('.unsave-btn').onclick = (e) => { e.stopPropagation(); unsavePost(post.id); };
    list.appendChild(row);
  });
}

// ── TOAST ────────────────────────────────────────────
let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'), 1500);
}

// ── INIT ─────────────────────────────────────────────
buildOnboarding();
if(selectedInterests.length > 0) {
  showScreen('swipe');
  loadPosts();
}
</script>
</body>
</html>
